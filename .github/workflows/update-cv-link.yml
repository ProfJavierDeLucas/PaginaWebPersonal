name: Update CV link and citations

on:
  push:
    paths:
      - '.github/workflows/update-cv-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update webpage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_link = 'https://www.fuw.edu.pl/~delucas/Curric-Eng.pdf'
          new_link = 'https://drive.google.com/file/d/1Xx-TSO-SMkllMngSxdaLl8fWerIKC0sf/view?usp=drivesdk'
          if old_link not in s:
              raise SystemExit('Old curriculum link not found')
          s = s.replace(old_link, new_link, 1)
          if 'Publications. Citations: 1405 Hirsch: 22' not in s:
              raise SystemExit('Citation text not found')
          s = s.replace('Publications. Citations: 1405 Hirsch: 22', 'Publications. Citations: 1423 Hirsch: 22', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update CV link and Google Scholar citations'
          git push
