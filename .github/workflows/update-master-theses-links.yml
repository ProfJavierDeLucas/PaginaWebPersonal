name: Update master theses links

on:
  push:
    paths:
      - '.github/workflows/update-master-theses-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          b_link = '<a href="MasterTheses/Bartosz_Maciej_Zawora_Master_Work_2021.html" style="color:red; text-decoration:none; font-weight:600; margin-left:8px;">[Master work]</a>'
          j_link = '<a href="MasterTheses/Julia_Lange_Master_Thesis_2020.html" style="color:red; text-decoration:none; font-weight:600; margin-left:8px;">[Master thesis]</a>'

          b_pat = re.compile(r'(<li><strong>B\.M\. Zawora 2021 - </strong><i>A\s*time-dependent energy-momentum method - </i>Prize\s*Joanny Gwizdow i Jerzy Glazer of the Faculty of\s*Physics of the University of Warsaw)(\s*</li>)', re.S)
          j_pat = re.compile(r'(<li><strong>J\. Lange 2020 -</strong><i>\s*A\s*Hamilton-Jacobi theory on twisted Poisson manifolds</i>)(\s*</li>)', re.S)

          if 'MasterTheses/Bartosz_Maciej_Zawora_Master_Work_2021.html' not in s:
              s, nb = b_pat.subn(lambda m: m.group(1) + ' ' + b_link + m.group(2), s, count=1)
              if nb != 1:
                  raise SystemExit('Could not patch Bartosz master item')
          if 'MasterTheses/Julia_Lange_Master_Thesis_2020.html' not in s:
              s, nj = j_pat.subn(lambda m: m.group(1) + j_link + m.group(2), s, count=1)
              if nj != 1:
                  raise SystemExit('Could not patch Julia master item')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add index.html
          git commit -m "Link master theses from students section" || exit 0
          git push
