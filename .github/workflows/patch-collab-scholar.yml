name: Patch collaborators and Scholar

"on":
  push:
    paths:
      - .github/workflows/patch-collab-scholar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch_collab_scholar.py
      - run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add erc-profile.html
          git commit -m "Link collaborators and Google Scholar metrics"
          git push
