name: Remove hero drawing

on:
  push:
    paths:
      - '.github/workflows/remove-hero-drawing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove mathematical hero drawing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('erc-profile.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#142b4d,#28639f);color:#fff;padding:36px 0 30px;border-bottom:5px solid #1c426d}.hero-bg{position:absolute;inset:0;pointer-events:none;opacity:.78}.hero-bg svg{position:absolute;right:-70px;top:-6px;width:min(760px,68vw);height:100%;filter:blur(.45px)}.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr 310px;gap:28px;align-items:center}'
          new_css = '.hero{background:linear-gradient(135deg,#142b4d,#28639f);color:#fff;padding:36px 0 30px;border-bottom:5px solid #1c426d}.hero-grid{display:grid;grid-template-columns:1.25fr 310px;gap:28px;align-items:center}'
          if old_css not in s:
              raise SystemExit('Expected hero CSS not found')
          s = s.replace(old_css, new_css, 1)

          pattern = r'\n  <div class="hero-bg" aria-hidden="true">.*?</svg>\n  </div>(?=\n  <div class="wrap hero-grid">)'
          s2, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected hero SVG block not found: {n}')

          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add erc-profile.html
          git commit -m "Remove mathematical hero background"
          git push
