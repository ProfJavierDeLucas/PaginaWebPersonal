name: Update theses info

on:
  push:
    paths:
      - '.github/workflows/update-theses.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and CV
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(text, old, new):
              if old not in text:
                  print('MISSING:', old[:80].replace('\n',' '))
              return text.replace(old, new)

          # Website: titles and years only.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '<li><strong>M. Borczyńska 2025 - </strong><i>Regular\n          and singular symplectic reduction on orbifolds</i></li>', '<li><strong>M. Borczyńska 2025 - </strong><i>Marsden--Meyer--Weinstein reductions in the singular orbifold setting with applications</i></li>')
          s = repl(s, '<li><strong>A. Maskalaniec 2024 -  </strong><i>Supersymplectic\n          geometry and reductions</i></li>', '<li><strong>A. Maskalaniec 2024 - </strong><i>Super symplectic geometry and reductions</i></li>')
          s = repl(s, '<li><strong>D. Wysocki  2017 -</strong><i> New\n          approaches to Lie bialgebras and their quantization</i></li>', '<li><strong>D. Wysocki 2017 - </strong><i>New approaches to Lie bialgebras and their quantization</i></li>')
          s = repl(s, '<li><strong>D. Spisak, </strong><i>Casimir-energy methods\n          -</i><strong> 2025/26 - in progress</strong></li>', '<li><strong>D. Spisak - </strong><i>Introduction to the energy-Casimir method and applications</i> <strong>2025/26 - in progress</strong></li>')
          s = repl(s, '<li><strong>M. Flis, </strong><i>Symmetries of\n          Differential equations and applications -</i><strong>\n          2025 </strong></li>', '<li><strong>M. Flis 2025 - </strong><i>Lie group symmetries of differential equations and applications</i></li>')
          s = repl(s, '<li><strong>J. Jurczak,  </strong><i>Homological\n          invariants of vector bundles and applications</i><strong>\n          - 2025 </strong></li>', '<li><strong>J. Jurczak 2025 - </strong><i>Homological invariants of vector bundles and applications</i></li>')
          s = repl(s, '<li><strong>M. Wojtkowiak,  </strong><i>Canonoid\n          Transformations: introduction and applications</i><strong>\n          - 2025 </strong></li>', '<li><strong>M. Wojtkowiak 2025 - </strong><i>Canonoid Transformations: introduction and applications</i></li>')
          s = repl(s, '<li><strong>K. Wolicki, </strong><i>Clifford algebras\n          and applications</i><strong> - 2025 </strong></li>', '<li><strong>K. Wolicki 2025 - </strong><i>Clifford algebras and their applications</i></li>')
          s = repl(s, '<li><strong>M. Matviienko - </strong><i>Mechanics on\n          Lie Algebroids: Theory and Applications </i><strong>-\n          2024</strong></li>', '<li><strong>M. Matviienko 2024 - </strong><i>Mechanics on Lie Algebroids: Theory and Applications</i></li>')
          s = repl(s, '<li><strong>W. Fabjanczuk - </strong><i>Metody\n          supergeometryczne i zastosowania w fizyce</i><strong>\n          - 2017</strong></li>', '<li><strong>W. Fabjańczuk 2017 - </strong><i>Supergeometric methods and applications in physics</i></li>')
          s = repl(s, '<li><strong>J. Szypulksi - </strong><i>Opis równań\n          Maxwella w geometrii różniczkowej i ich zastosowania\n          -</i><strong> 2019</strong></li>', '<li><strong>J. Szypulski 2019 - </strong><i>Differential geometric description of Maxwell\'s equations and its applications</i></li>')
          s = repl(s, '<li><strong>J. Lange - </strong><i>Infinite-dimensional\n          Marsden-Weinstein reduction in quantum mechanics </i><strong>-\n          2018</strong></li>', '<li><strong>J. Lange 2018 - </strong><i>Infinite-dimensional Marsden-Weinstein reduction in quantum mechanics</i></li>')
          s = repl(s, '<li><strong>B.M. Zawora - </strong><i>Zastosowania\n          mechaniki geometrycznej w badaniu dynamiki asteroir\n          </i><strong>- 2019</strong></li>', '<li><strong>B.M. Zawora 2019 - </strong><i>Applications of Geometric Mechanics to the Dynamics of Asteroid Pairs</i></li>')
          s = repl(s, '<li><strong>M. Skowronek -  </strong><i>Zastosowania\n          redukcji Marsdena-Weinsteina w równaniach\n          różniczkowych fizyki </i><strong>- 2016</strong></li>', '<li><strong>M. Skowronek 2016 - </strong><i>Applications of the Marsden-Weinstein reduction in differential equations</i></li>')
          s = repl(s, '<li><strong>M. Lewandowski - </strong><i>Teoria i\n          zastosowania algebr Liego pól wektorowych\n          konforemnych i Killinga </i><strong>- 2016</strong></li>', '<li><strong>M. Lewandowski 2016 - </strong><i>Theory and applications of Lie algebras of conformal and Killing vector fields</i></li>')
          s = repl(s, '<li><strong>D. Wysocki -</strong><i> Algebraiczne i\n          geometryczne metody kwantyzacji</i><strong> - 2015</strong></li>', '<li><strong>D. Wysocki 2015 - </strong><i>Algebraic and geometric methods of quantization</i></li>')
          p.write_text(s, encoding='utf-8')

          # CV source: compact corrections and defense dates when present in the screenshots.
          q = Path('Curric-Eng.tex')
          t = q.read_text(encoding='utf-8')
          fixes = [
              ('S. Vilari\\~no', 'S. Vilariño'),
              ('Batchelor', 'Bachelor'),
              ('Title: {\\it Classification of Lie bialgebras and methods of quantization}.', 'Title: {\\it New approaches to Lie bialgebras and their quantization}. Defended on September 19, 2017.'),
              ('Title: {\\it A Hamilton-Jacobi theory on twisted Poisson manifolds}.', 'Title: {\\it A Hamilton-Jacobi theory on twisted Poisson manifolds}. Defended on September 16, 2020.'),
              ('Title: {\\it A time-dependent energy-momentum method}. He got', 'Title: {\\it A time-dependent energy-momentum method}. Defended on September 21, 2021. He got'),
              ('Title: {\\it New approaches to k-contact geometry and applications}.', 'Title: {\\it New approaches to $k$-contact geometry and applications}. Defended on September 25, 2024.'),
              ('Title: {\\it Supersymplectic geometry and reductionss}.', 'Title: {\\it Super symplectic geometry and reductions}. Defended on September 19, 2024.'),
              ('Title: {\\it On Marsden--Weinstein reductions and orbifolds}.', 'Title: {\\it Marsden--Meyer--Weinstein reductions in the singular orbifold setting with applications}. Defended on November 5, 2025.'),
              ('Title: {\\it Cartan Geometry in an infinite-dimensional setting}.', 'Title: {\\it Complex geometry, Cartan bundles, and their applications to gauge theory}. Defended on September 23, 2025.'),
              ('Title: {\\it Algebraic and geometric methods of quantization}.', 'Title: {\\it Algebraic and geometric methods of quantization}. Defended on July 23, 2015.'),
              ('Title: {\\it Theory and applications of Lie algebras of conformal and Killing vector fields}.', 'Title: {\\it Theory and applications of Lie algebras of conformal and Killing vector fields}. Defended on September 22, 2016.'),
              ('Title: {\\it Applications of the Marsden-Weinstein reduction to physics}.', 'Title: {\\it Applications of the Marsden-Weinstein reduction in differential equations}. Defended on September 22, 2016.'),
              ('Title: {\\it Supergeometric methods and applications in Physics}.', 'Title: {\\it Supergeometric methods and applications in physics}. Defended on September 18, 2017.'),
              ('In 2017 I supervised the Bachelor thesis of {\\bf J. Lange}', 'In 2018 I supervised the Bachelor thesis of {\\bf J. Lange}'),
              ('Title: {\\it Infinite-dimensional Marsden-Weinstein reduction and applications to quantum mechanics}.', 'Title: {\\it Infinite-dimensional Marsden-Weinstein reduction in quantum mechanics}. Defended on September 13, 2018.'),
              ('In 2018 I supervised the Bachelor thesis of {\\bf B. Zawora}', 'In 2019 I supervised the Bachelor thesis of {\\bf B. Zawora}'),
              ('Title: {\\it Zastosowania mechaniki geometrycznej w dynamice par asterior\\\'ow}.', 'Title: {\\it Applications of Geometric Mechanics to the Dynamics of Asteroid Pairs}. Defended on September 23, 2019.'),
              ('In 2018 I supervised the Bachelor thesis of {\\bf J. Szypulsi}', 'In 2019 I supervised the Bachelor thesis of {\\bf J. Szypulski}'),
              ('Title: {\\it Geometryczne r\\\'ownania Maxwella}.', 'Title: {\\it Differential geometric description of Maxwell\\\'s equations and its applications}. Defended on July 22, 2019.'),
              ('Title: {\\it Energy-momentum method: theory and generalisations}.', 'Title: {\\it The energy-momentum method: Theory, generalisations, and applications}. Defended on September 26, 2022.'),
              ('Title: {\\it  On $b^k$-symplectic manifolds and applications }.', 'Title: {\\it On $b^k$-symplectic manifolds and applications}. Defended on July 22, 2023.'),
              ('Title: {\\it  Mechanics on Lie Algebroids: Theory and Applications}.', 'Title: {\\it Mechanics on Lie Algebroids: Theory and Applications}. Defended on September 23, 2024.'),
              ('In 2024/25 I am supervising  the Bachelor thesis of {\\bf  Małgorzata Flis} at the Faculty of Physics of the University of Warsaw. Title: {\\it to be confirmed}.', 'In 2025 I supervised the Bachelor thesis of {\\bf Małgorzata Flis} at the Faculty of Physics of the University of Warsaw. Title: {\\it Lie group symmetries of differential equations and applications}. Defended on September 29, 2025.'),
              ('In 2024/25 I am supervising  the Bachelor thesis of {\\bf  Jakub Jurczak} at the Faculty of Physics of the University of Warsaw. Title: {\\it  Homological invariants of vector\n\tbundles and applications}.', 'In 2025 I supervised the Bachelor thesis of {\\bf Jakub Jurczak} at the Faculty of Physics of the University of Warsaw. Title: {\\it Homological invariants of vector bundles and applications}. Defended on September 23, 2025.'),
              ('In 2024/25 I am supervising  the Bachelor thesis of {\\bf Krzysztof Wolicki} at the Faculty of Physics of the University of Warsaw. Title: {\\it  Clifford algebras and their\n\tapplications}.', 'In 2025 I supervised the Bachelor thesis of {\\bf Krzysztof Wolicki} at the Faculty of Physics of the University of Warsaw. Title: {\\it Clifford algebras and their applications}. Defended on September 29, 2025.'),
          ]
          for old, new in fixes:
              t = repl(t, old, new)
          marker = 'In 2025 I supervised the Bachelor thesis of {\\bf Krzysztof Wolicki}'
          add = '\\item In 2025 I supervised the Bachelor thesis of {\\bf Michał Wojtkowiak} at the Faculty of Physics of the University of Warsaw. Title: {\\it Canonoid Transformations: introduction and applications}. Defended on September 29, 2025.\n'
          if add not in t and marker in t:
              pos = t.index(marker)
              pos = t.index('\n', pos) + 1
              t = t[:pos] + add + t[pos:]
          q.write_text(t, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add index.html Curric-Eng.tex
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update thesis titles and defense dates"
            git push
          fi
