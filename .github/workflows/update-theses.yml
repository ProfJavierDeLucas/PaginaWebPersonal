name: Final theses cleanup

on:
  push:
    paths:
      - '.github/workflows/update-theses.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean remaining thesis entries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def r(s, a, b):
              if a not in s:
                  print('MISSING', a[:70].replace('\n',' '))
              return s.replace(a, b)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = r(s, '<li><strong>T. Frelik - </strong><i>Multisymplectic\n          theory, reduction and applications </i><strong>-\n          2023</strong></li>', '<li><strong>T. Frelik 2023 - </strong><i>Multisymplectic theory, reduction and applications</i></li>')
          s = r(s, '<li><strong>M. Duch - </strong><i> On\n          b^k-symplectic manifolds and applications</i><strong>\n          - 2023</strong></li>', '<li><strong>M. Duch 2023 - </strong><i>On b<sup>k</sup>-symplectic manifolds and applications</i></li>')
          s = r(s, '<li><strong>M. Tobolski - </strong><i>Riccati equations\n          over normed division algebras with applications</i><strong> - 2015</strong></li>', '<li><strong>M. Tobolski 2015 - </strong><i>Riccati equations over normed division algebras with applications</i></li>')
          anchor = '<li><strong>M. Duch 2023 - </strong><i>On b<sup>k</sup>-symplectic manifolds and applications</i></li>'
          add = '\n        <li><strong>A. Maskalaniec 2022 - </strong><i>The energy-momentum method: Theory, generalisations, and applications</i></li>'
          if add.strip() not in s and anchor in s:
              s = s.replace(anchor, anchor + add)
          p.write_text(s, encoding='utf-8')

          q = Path('Curric-Eng.tex')
          t = q.read_text(encoding='utf-8')
          dup = '\\item In 2022 I am supervising  the Bachelor thesis of {\\bf A. Maskalaniec} at the Faculty of Physics of the University of Warsaw. Title: {\\it The energy-momentum method: Theory, generalisations, and applications}. Defended on September 26, 2022. Prize for master theses, Faculty of Physics, University of Warsaw, 2021.\n'
          t = t.replace(dup, '')
          t = t.replace('Title: {\\it Multisymplectic reduction: theory, reduction, and applications}.', 'Title: {\\it Multisymplectic theory, reduction and applications}.')
          t = t.replace('In 2024/25 I am supervising  the Bachelor thesis of {\\bf  Marek Morawski} at the Faculty of Physics of the University of Warsaw. Title: {\\it to be confirmed}.', 'In 2025/26 I am supervising the Bachelor thesis of {\\bf Daniel Spisak} at the Faculty of Physics of the University of Warsaw. Title: {\\it Introduction to the energy-Casimir method and applications}.')
          if 'Serafin Yablonski} at the Faculty of Physics of the University of Warsaw. Title: {\\it Theory and applications of Lie groupoids and algebroids}' not in t:
              insert = '\\item In 2025/26 I am supervising the Bachelor thesis of {\\bf Serafin Yablonski} at the Faculty of Physics of the University of Warsaw. Title: {\\it Theory and applications of Lie groupoids and algebroids}.\n'
              t = t.replace('\\end{itemize}\n\n\\vskip 0.5cm\n\\centerline{\\bf Supervision of students}', insert + '\n\\end{itemize}\n\n\\vskip 0.5cm\n\\centerline{\\bf Supervision of students}')
          q.write_text(t, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add index.html Curric-Eng.tex
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean remaining thesis entries"
            git push
          fi
