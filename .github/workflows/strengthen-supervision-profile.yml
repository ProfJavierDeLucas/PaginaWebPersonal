name: Strengthen supervision profile

on:
  push:
    paths:
      - '.github/workflows/strengthen-supervision-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update supervision section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('erc-profile.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>The full page records PhD, master\'s and bachelor\'s supervision. Recent student topics include k-contact geometry, supersymplectic geometry, Cartan bundles, orbifold reduction, Lie group symmetries, vector bundle invariants, Clifford algebras, Lie algebroids, energy-momentum methods and energy-Casimir methods.</p>'
          new = '<p>I have supervised more than 30 bachelor\'s and master\'s theses and student research projects, in addition to doctoral supervision. Several of my students have received research prizes and academic distinctions, and some former students now hold permanent faculty positions. Recent student topics include k-contact geometry, supersymplectic geometry, Cartan bundles, orbifold reduction, Lie group symmetries, vector bundle invariants, Clifford algebras, Lie algebroids, energy-momentum methods and energy-Casimir methods.</p>'
          if old not in s:
              raise SystemExit('Target supervision paragraph not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add erc-profile.html
          git commit -m "Strengthen supervision and mentoring profile"
          git push
