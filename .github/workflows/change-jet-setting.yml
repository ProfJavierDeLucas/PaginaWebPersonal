name: Update jet-setting wording

on:
  push:
    paths:
      - '.github/workflows/change-jet-setting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('erc-profile.html')
          s = p.read_text(encoding='utf-8')
          old = 'beyond the standard variational setting.'
          new = 'beyond the standard jet setting.'
          if old not in s:
              raise SystemExit('Expected wording not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add erc-profile.html
          git commit -m "Use standard jet setting wording"
          git push
