name: Reduce ERC header text

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run ERC header typography patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography patch
        run: python .github/reduce_erc_header_text.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-profile.html
          git diff --cached --quiet || git commit -m "Reduce ERC header typography by ten percent"
          git push
