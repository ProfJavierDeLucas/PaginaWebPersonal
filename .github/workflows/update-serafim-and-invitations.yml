name: One-time update for Yablonski thesis and 2026 invitations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-serafim-and-invitations.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish thesis PDF and update pages
        env:
          PDF_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ed54-81f4-b144-b4183bb4d1ed/raw?se=2026-09-15T05%3A28%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=3919434a-4ec2-53a2-86fa-a16663729799&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A16%3A34Z&ske=2026-09-15T20%3A16%3A34Z&sks=b&skv=2026-02-06&sig=cBRgQcFuuHByUT5y/fElqGQitOpge24u0bURm5Ez1%2B8%3D'
        run: |
          set -euo pipefail
          PDF_PATH='BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf'
          mkdir -p BachelorTheses
          curl --fail --location --retry 3 "$PDF_URL" -o "$PDF_PATH"
          test -s "$PDF_PATH"
          test "$(stat -c%s "$PDF_PATH")" -gt 400000

          python - <<'PY'
          from pathlib import Path

          detailed = Path('detailed.html')
          s = detailed.read_text(encoding='utf-8')

          old_count = "Bachelor's Students 16+2(in progress):"
          new_count = "Bachelor's Students 17+1(in progress):"
          if old_count in s:
              s = s.replace(old_count, new_count, 1)

          old_student = '<li><strong>S. Yablonski, </strong><i>Theory and applications of Lie groupoids and algebroids -</i><strong> 2025/26 - in progress</strong></li>'
          new_student = ('<li><strong>S. Yablonski 2026 - </strong><i>Symplectic Groupoids and Physical Applications</i>. '
                         'Bachelor\'s thesis in Physics, Faculty of Physics, University of Warsaw. The thesis develops an introductory route from Lie groupoids and Lie algebroids to Poisson geometry and symplectic groupoids, with emphasis on geometric mechanics and mathematical physics. It discusses the Poisson structure induced on the base of a symplectic groupoid, Lagrangian bisections and the identification of its Lie algebroid with the cotangent Lie algebroid, and treats the pair groupoid and cotangent groupoid as principal examples. The physical part applies the cotangent groupoid to the free rigid body, recovering Lie--Poisson reduction, Euler equations, reconstruction and conservation of spatial angular momentum. '
                         '<a href="BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf" target="_blank" rel="noopener" style="color:red;text-decoration:none;font-weight:600;margin-left:8px;">[Bachelor thesis PDF]</a> '
                         '<a href="https://apd.uw.edu.pl/diplomas/255550/" target="_blank" rel="noopener" style="color:blue;text-decoration:none;font-weight:600;margin-left:8px;">[APD record]</a></li>')
          if old_student not in s and 'Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf' not in s:
              raise SystemExit('Expected old Yablonski entry not found')
          s = s.replace(old_student, new_student, 1)

          old_uiuc = '<b>• 2026 - Invited talk, Department of Mathematics, University of Illinois Urbana-Champaign, USA.</b>'
          new_uiuc = '<b>• 2026 - Invited seminar talk, Department of Mathematics, University of Illinois Urbana-Champaign, USA (9 November 2026).</b>'
          if old_uiuc in s:
              s = s.replace(old_uiuc, new_uiuc, 1)

          talks_head = '<section class="section" id="projects"><h2 class="section-title">Talks and slides</h2>'
          talks_new = (talks_head +
              '<p><strong>Invited seminar talk</strong>, Department of Mathematics, University of Illinois Urbana-Champaign, Urbana-Champaign, USA, <strong>9 November 2026</strong>. Invited by Rui Loja Fernandes; seminar slot reserved for this visit.<br/></p>'
              '<p><strong>Invited participant</strong>, <i>Workshop on Recent Developments in Symplectic Dynamics</i>, School of Mathematics, Institute for Advanced Study, Princeton, USA, <strong>2–6 November 2026</strong>. Invitation to the Fall Special Year workshop led by Michael Hutchings. <a href="https://www.ias.edu/math/events/workshop-recent-developments-symplectic-dynamics" target="_blank" rel="noopener" style="color:blue;text-decoration:none;font-weight:600;margin-left:8px;">[IAS workshop]</a><br/></p>')
          if 'seminar slot reserved for this visit' not in s:
              if talks_head not in s:
                  raise SystemExit('Talks section heading not found')
              s = s.replace(talks_head, talks_new, 1)

          detailed.write_text(s, encoding='utf-8')

          index = Path('index.html')
          x = index.read_text(encoding='utf-8')
          x = x.replace('"dateModified": "2026-09-14"', '"dateModified": "2026-09-15"', 1)
          old_rec = '<article class="card"><h3>International recognition</h3><p>IAS invitation, Simons–CRM Professorship, recent k-contact and jet-geometry work, and an active international seminar network.</p></article>'
          new_rec = '<article class="card"><h3>International recognition</h3><p>Invited participation at the Institute for Advanced Study, Princeton (2–6 November 2026), followed by an invited seminar talk at the University of Illinois Urbana-Champaign (9 November 2026), together with the Simons–CRM Professorship and an active international research network.</p></article>'
          if old_rec in x:
              x = x.replace(old_rec, new_rec, 1)
          index.write_text(x, encoding='utf-8')
          PY

          git rm .github/workflows/update-serafim-and-invitations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add detailed.html index.html "$PDF_PATH"
          git commit -m 'Publish Serafim Yablonski thesis and update Princeton/UIUC invitations'
          git push
