name: Adapt front cards

on:
  push:
    paths:
      - '.github/workflows/adapt-front-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch front cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('erc-profile.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<article class="card"><h3>Scientific identity</h3><p>Differential geometry and mathematical physics, focused on structural methods for equations, symmetries and field theories.</p></article>':
            '<article class="card"><h3>Scientific programme</h3><p>Geometric structures for PDEs, field theories and integrability, centred on k-contact and jet geometry.</p></article>',
            '<article class="card"><h3>Main frontier</h3><p>Building k-contact and polarised jet geometry as intrinsic frameworks for PDEs, transformations and non-conservative dynamics.</p></article>':
            '<article class="card"><h3>Core frontier</h3><p>Developing k-contact geometry as a new intrinsic language for jets, PDE transformations, reductions and non-conservative field theories.</p></article>',
            '<article class="card"><h3>Research environment</h3><p>Gamma Research Group, doctoral and master projects, weekly seminars, thesis supervision and international collaborations.</p></article>':
            '<article class="card"><h3>Group and feasibility</h3><p>Gamma Research Group, PhD and master pipeline, weekly seminars and international collaborators supporting a coherent research agenda.</p></article>',
            '<article class="card"><h3>Recent visibility</h3><p>IAS workshop invitation, Simons–CRM Professorship, active k-contact/jets publication stream and international seminar activity.</p></article>':
            '<article class="card"><h3>International standing</h3><p>IAS invitation, Simons–CRM Professorship, recent k-contact/jets papers and an active international seminar network.</p></article>',
          }
          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit('Missing expected snippets: ' + str(len(missing)))
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('front cards adapted')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add erc-profile.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Adapt ERC landing front cards"
            git push
          fi
