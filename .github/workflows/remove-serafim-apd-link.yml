name: Remove Serafim APD link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-serafim-apd-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove APD link and keep thesis PDF only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('detailed.html')
          s = p.read_text(encoding='utf-8')
          apd = '<a href="https://apd.uw.edu.pl/diplomas/255550/" target="_blank" rel="noopener" style="color:blue;text-decoration:none;font-weight:600;margin-left:8px;">[APD record]</a>'
          if apd not in s:
              raise SystemExit('Serafim APD link not found')
          s = s.replace(apd, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/remove-serafim-apd-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add detailed.html
          git commit -m 'Remove APD link from Serafim thesis entry'
          git push
