name: Fix Julia bachelor link placeholder

on:
  push:
    paths:
      - '.github/workflows/fix-julia-bachelor-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incorrect Julia master link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<a href="MasterTheses/Julia_Lange_Master_Thesis_2020\.html"[^>]*>\[Master thesis\]</a>', '', s)
          p.write_text(s, encoding='utf-8')
          q = Path('MasterTheses/index.html')
          if q.exists():
              t = q.read_text(encoding='utf-8')
              t = re.sub(r'<li><a href="Julia_Lange_Master_Thesis_2020\.html">.*?</li>\n?', '', t, flags=re.S)
              q.write_text(t, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add index.html MasterTheses/index.html
          git commit -m "Remove incorrect Julia master thesis link" || exit 0
          git push
