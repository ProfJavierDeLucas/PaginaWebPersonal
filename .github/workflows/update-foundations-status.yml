name: Update Foundations status

on:
  push:
    paths:
      - '.github/workflows/update-foundations-status.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update webpage text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<li>J. de Lucas, X. Rivas, T. Sobczak, <i>Foundations on k-contact geometry</i>, submitted  '
          new = '<li>J. de Lucas, X. Rivas, T. Sobczak, <i>Foundations on k-contact geometry</i>, under review in JPA  '
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Foundations on k-contact geometry</i>, under review in JPA' in s:
              pass
          else:
              raise SystemExit('Foundations status text not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update Foundations status on webpage'
          git push
