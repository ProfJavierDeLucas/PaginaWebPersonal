name: Fix ERC portrait responsiveness

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run ERC portrait responsive patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive portrait patch
        run: python .github/fix_erc_portrait_responsive.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-profile.html
          git diff --cached --quiet || git commit -m "Make ERC portrait responsive"
          git push
