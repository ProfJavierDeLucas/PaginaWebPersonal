name: Patch ERC header spacing and keywords

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run ERC header spacing patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header layout patch
        run: python .github/patch_erc_header_spacing_keywords.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-profile.html
          git diff --cached --quiet || git commit -m "Improve ERC header spacing and keyword layout"
          git push
