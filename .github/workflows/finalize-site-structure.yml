name: Finalize personal website structure

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run final website promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote polished profile and preserve detailed page
        run: python .github/finalize_site_structure.py
      - name: Commit final website structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html detailed.html erc-profile.html sitemap.xml
          git diff --cached --quiet || git commit -m "Promote research profile to homepage"
          git push
