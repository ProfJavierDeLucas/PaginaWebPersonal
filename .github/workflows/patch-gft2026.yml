name: Patch GFT 2026 conference entry

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run GFT 2026 correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction
        run: python .github/patch_gft2026.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-profile.html index.html
          git diff --cached --quiet || git commit -m "Correct 2nd International Workshop on Geometric Field Theory entry"
          git push
