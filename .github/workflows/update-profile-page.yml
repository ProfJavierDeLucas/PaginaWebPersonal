name: Update profile page

on:
  push:
    paths:
      - '.github/workflows/update-profile-page.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update publication and IAS distinction
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          prize_old = '''  <p>\n    • 2025 - Rector prize of third degree for research achievements,\n    Faculty of Physics, University of Warsaw.<br/>'''
          prize_new = '''  <p>\n    <b>• 2026 - Invited to participate in the Workshop on Recent Developments in Symplectic Dynamics, School of Mathematics, Institute for Advanced Study, Princeton, USA (2–6 November 2026).</b>\n    <a href="https://www.ias.edu/math/events/workshop-recent-developments-symplectic-dynamics" style="color:blue; text-decoration:none; font-weight:600; margin-left:8px;">[IAS workshop]</a><br/>\n    • 2025 - Rector prize of third degree for research achievements,\n    Faculty of Physics, University of Warsaw.<br/>'''
          if prize_old not in text:
              raise SystemExit('Prize insertion point not found')
          text = text.replace(prize_old, prize_new, 1)

          pub_old = '''<li>R. Campoamor-Stursberg, O. Carballal, F.J. Herranz, J. de Lucas, <i>Mixed superposition rules for Lie systems, compatible geometric structures, and applications</i>, Accepted in Studies in Applied Mathematics\n<a href="https://arxiv.org/abs/2511.01063" style="color:blue; text-decoration:none; font-weight:600; margin-left:8px;">[arXiv]</a>\n</li>'''
          pub_new = '''<li>R. Campoamor-Stursberg, O. Carballal, F.J. Herranz, J. de Lucas, <i>Mixed superposition rules for Lie systems, compatible geometric structures, and applications</i>, Stud. Appl. Math. <b>157</b>, e70297 (2026).\n<a href="https://arxiv.org/abs/2511.01063" style="color:blue; text-decoration:none; font-weight:600; margin-left:8px;">[arXiv]</a>\n<a href="https://onlinelibrary.wiley.com/doi/abs/10.1111/sapm.70297" style="color:red; text-decoration:none; font-weight:600; margin-left:8px;">[journal]</a>\n</li>'''
          if pub_old not in text:
              raise SystemExit('Publication entry not found')
          text = text.replace(pub_old, pub_new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update publication and IAS distinction"
          git push
