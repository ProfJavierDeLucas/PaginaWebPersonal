name: One-time publish Serafim submission-ready PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-serafim-submission-pdf.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Replace Serafim thesis PDF with GitHub submission-ready artifact
        env:
          ARTIFACT_ZIP_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3c64-8210-8c21-7bb8eb43a952/raw?se=2026-09-15T05%3A50%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=74bae01c-bfb4-5aca-9269-baf023a7713b&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T04%3A14%3A05Z&ske=2026-09-16T04%3A14%3A05Z&sks=b&skv=2026-02-06&sig=V9Ntaxp7kyaAhx8Jx8IT1v8UBc66pIn0jzM0l8pUc74%3D'
        run: |
          set -euo pipefail
          TMPZIP="$(mktemp --suffix=.zip)"
          TMPDIR="$(mktemp -d)"
          curl --fail --location --retry 3 "$ARTIFACT_ZIP_URL" -o "$TMPZIP"
          unzip -q "$TMPZIP" -d "$TMPDIR"
          SOURCE="$TMPDIR/Serafim_thesis_SUBMISSION_READY_2026-09-08.pdf"
          TARGET="BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf"
          test -s "$SOURCE"
          test "$(stat -c%s "$SOURCE")" -eq 465072
          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          git rm .github/workflows/replace-serafim-submission-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Replace Serafim thesis with submission-ready GitHub build'
          git push
