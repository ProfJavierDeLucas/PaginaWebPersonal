name: Patch ERC selected work and SEO

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run ERC profile patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch_erc_selected_works.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-profile.html index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Strengthen ERC profile selected work and SEO"
          git push
