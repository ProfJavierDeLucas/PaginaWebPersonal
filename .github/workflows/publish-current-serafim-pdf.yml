name: Publish current Serafim PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-current-serafim-pdf.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace thesis PDF with current GitHub build
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4434-81f4-b37e-5b5394a5177b/raw?se=2026-09-15T06%3A07%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=9aec2d65-702e-5569-8a73-2e70f25692d7&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T05%3A42%3A25Z&ske=2026-09-16T05%3A42%3A25Z&sks=b&skv=2026-02-06&sig=pVX%2BpXGomO%2BvvDy92i5V6%2BZfWbXtcPN5COSRyK98dv4%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/serafim.zip
          mkdir -p BachelorTheses
          unzip -p /tmp/serafim.zip Serafim_thesis_SUBMISSION_READY_2026-09-08.pdf > BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf
          test -s BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf
          test "$(stat -c%s BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf)" -eq 478845
          git rm .github/workflows/publish-current-serafim-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BachelorTheses/Serafim_Yablonski_Symplectic_Groupoids_and_Physical_Applications.pdf
          git commit -m 'Publish current Serafim thesis with linked bibliography'
          git push
