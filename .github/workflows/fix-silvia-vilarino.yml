name: Fix Silvia Vilarino spelling

on:
  push:
    paths:
      - '.github/workflows/fix-silvia-vilarino.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spelling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'Silvia Vilarino': 'Silvia Vilariño',
              'S. Vilarino': 'S. Vilariño',
              'Vilarino': 'Vilariño',
          }
          changed = []
          for pattern in ('*.html', '*.htm', '*.md'):
              for path in Path('.').rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for old, new_value in replacements.items():
                      new = new.replace(old, new_value)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(str(path))
          print('Changed files:', changed)
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Silvia Vilariño spelling on website"
            git push
          fi
# trigger
