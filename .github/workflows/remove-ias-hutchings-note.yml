name: Remove IAS workshop note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-ias-hutchings-note.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove IAS workshop descriptive note
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('detailed.html')
          s = p.read_text(encoding='utf-8')
          text = ' Invitation to the Fall Special Year workshop led by Michael Hutchings.'
          if text not in s:
              raise SystemExit('Target IAS note not found')
          s = s.replace(text, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/remove-ias-hutchings-note.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add detailed.html
          git commit -m 'Remove IAS workshop descriptive note'
          git push
