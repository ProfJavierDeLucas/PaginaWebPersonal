name: Website patch

on:
  push:
    paths:
      - '.github/workflows/fix-vilarino-and-photo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          new = text
          enye = chr(0x00f1)
          good_short = 'S. Vilari' + enye + 'o'
          good_full = 'Silvia Vilari' + enye + 'o'
          good_last = 'Vilari' + enye + 'o'
          photo = b'Bia\xc3\x85\xc2\x82ystok.jpg'.decode('utf-8')

          pairs = [
              ('S. Vilari' + '\\\\' + '~no', good_short),
              ('S. Vilari' + '\\' + '~no', good_short),
              ('S. Vilari~no', good_short),
              ('S. Vilarino', good_short),
              ('Silvia Vilarino', good_full),
              ('Silvia Vilari' + '\\\\' + '~no', good_full),
              ('Silvia Vilari' + '\\' + '~no', good_full),
              ('Vilarino', good_last),
              ('Vilari' + '\\\\' + '~no', good_last),
              ('Vilari' + '\\' + '~no', good_last),
          ]
          for old, value in pairs:
              new = new.replace(old, value)

          new = new.replace('YoOpava.jpeg', photo)

          p.write_text(new, encoding='utf-8')
          print('changed', new != text)
          print('YoOpava_left', 'YoOpava.jpeg' in new)
          print('bad_tex_left', ('Vilari' + '\\' + '~no') in new or ('Vilari' + '\\\\' + '~no') in new)
          print('bad_ascii_left', 'Vilarino' in new)
          print('photo_refs', new.count(photo))
          PY
      - name: Commit patch
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Silvia Vilarino spelling and Bialystok portrait"
            git push
          fi
