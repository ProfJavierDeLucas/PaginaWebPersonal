name: Website text and photo fix

on:
  push:
    paths:
      - '.github/workflows/fix-vilarino-and-photo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          new = text

          # Correct bad TeX-style spelling variants to proper Unicode.
          pairs = [
              ('S. Vilari\\\\\\~no', 'S. Vilari\u00f1o'),
              ('S. Vilari\\\\~no', 'S. Vilari\u00f1o'),
              ('S. Vilari\\~no', 'S. Vilari\u00f1o'),
              ('S. Vilari~no', 'S. Vilari\u00f1o'),
              ('S. Vilarino', 'S. Vilari\u00f1o'),
              ('Silvia Vilarino', 'Silvia Vilari\u00f1o'),
              ('Silvia Vilari\\\\~no', 'Silvia Vilari\u00f1o'),
              ('Silvia Vilari\\~no', 'Silvia Vilari\u00f1o'),
              ('Vilarino', 'Vilari\u00f1o'),
              ('Vilari\\\\~no', 'Vilari\u00f1o'),
              ('Vilari\\~no', 'Vilari\u00f1o'),
          ]
          for old, value in pairs:
              new = new.replace(old, value)

          # Use the Bialystok image file already present in the repo.
          new = new.replace('YoOpava.jpeg', 'BiaÅystok.jpg')

          p.write_text(new, encoding='utf-8')
          print('changed:', new != text)
          print('YoOpava left:', 'YoOpava.jpeg' in new)
          print('bad surname left:', any(x in new for x in ['Vilari\\\\~no', 'Vilari\\~no', 'Vilarino']))
          print('Bialystok refs:', new.count('BiaÅystok.jpg'))
          PY
      - name: Commit changes
        run: |
          git config user.name "ProfJavierDeLucas"
          git config user.email "j.de-lucas-ara@uw.edu.pl"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Silvia Vilariño spelling and use Bialystok portrait"
            git push
          fi
